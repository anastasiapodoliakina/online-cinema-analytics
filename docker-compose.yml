name: online-cinema-dz5

x-kafka-env: &kafka-env
  CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  KAFKA_DEFAULT_REPLICATION_FACTOR: 2
  KAFKA_MIN_INSYNC_REPLICAS: 1
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx384m

x-kafka: &kafka
  image: apache/kafka:3.9.0
  healthcheck:
    test: [CMD-SHELL, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1']
    interval: 15s
    timeout: 15s
    retries: 15
    start_period: 30s

x-app: &app
  image: online-cinema-dz5-app:local
  pull_policy: never

services:
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes:
      - kafka-1:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
    volumes:
      - kafka-2:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
    volumes:
      - kafka-3:/var/lib/kafka/data

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    entrypoint: [/bin/bash, -c]
    command:
      - |
        trap 'kill -TERM "$$child" 2>/dev/null; exit 0' TERM INT
        while true; do
          /etc/confluent/docker/run &
          child=$$!
          wait "$$child" && exit 0
          sleep 2
        done
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 2
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    ports: ['127.0.0.1:58081:8081']
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8081/subjects >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
    ports: ['127.0.0.1:58123:8123']
    healthcheck:
      test: [CMD-SHELL, 'clickhouse-client --user cinema --password cinema --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cinema -d cinema']
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: online-cinema-dz5-minio:local
    build: ./minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: cinema
      MINIO_ROOT_PASSWORD: cinema-secret
    volumes:
      - minio:/data
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:9000/minio/health/live', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 15

  init:
    <<: *app
    build: .
    command: python -m app.init
    depends_on:
      schema-registry: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}

  movie:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    ports: ['127.0.0.1:58000:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 10

  aggregation:
    <<: *app
    command: python -m app.aggregation
    environment:
      AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-300}
    depends_on:
      init: {condition: service_completed_successfully}
    ports: ['127.0.0.1:58002:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cinema
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.8.2
    depends_on:
      init: {condition: service_completed_successfully}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:53000:3000']
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  integration-tests:
    <<: *app
    profiles: [test]
    command: python -m unittest discover -s tests -v
    depends_on:
      movie: {condition: service_healthy}
      aggregation: {condition: service_healthy}
      grafana: {condition: service_healthy}

volumes:
  kafka-1:
  kafka-2:
  kafka-3:
  clickhouse:
  postgres:
  minio:
  grafana:
